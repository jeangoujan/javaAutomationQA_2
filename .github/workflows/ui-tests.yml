name: UI Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    env:
      SELENIUM_REMOTE_URL: http://localhost:4444

    services:
      selenium:
        image: selenium/standalone-chrome:4.21.0-20240214
        options: --shm-size=2g
        ports:
          - 4444:4444

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ===== DEBUG =====
      - name: Debug Selenium URL
        run: echo "SELENIUM_REMOTE_URL=$SELENIUM_REMOTE_URL"

      - name: Wait for Selenium Grid
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep '"ready":true'; then
              echo "Selenium Grid is ready"
              exit 0
            fi
            echo "Waiting for Selenium Grid..."
            sleep 2
          done
          echo "Selenium Grid did not become ready"
          exit 1

      # ===== RUN TESTS =====
      - name: Run UI tests
        run: ./gradlew test
        continue-on-error: true

      # ===== SELENIUM LOGS (КРИТИЧНО) =====
      - name: Dump Selenium logs
        if: always()
        run: |
          docker ps
          docker logs $(docker ps -q)

      # ===== ALLURE =====
      - name: Install Allure CLI
        if: always()
        run: |
          curl -Ls https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz -o allure.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate app/build/allure-results -o allure-report --clean

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true